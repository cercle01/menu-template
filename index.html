<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Menu</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#f4ebdc;
      --text:#0b0705;
      --accent:#9e5521;
      --muted:#6e655c;
      --line:rgba(11,7,5,.15);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:"Cairo",Arial,sans-serif;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .container{
      width:min(1180px,90%);
      margin:auto;
    }

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(244,235,220,.95);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }

    nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      letter-spacing:.08em;
    }

    .brand span{
      color:var(--accent);
    }

    .nav-links{
      display:flex;
      gap:10px;
    }

    .nav-links a{
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 15px;
      font-size:13px;
    }

    .hero{
      padding:100px 0 80px;
      border-bottom:1px solid var(--line);
    }

    .eyebrow{
      color:var(--accent);
      font-size:12px;
      letter-spacing:.16em;
      margin-bottom:20px;
    }

    h1{
      font-size:clamp(52px,9vw,105px);
      line-height:.98;
      letter-spacing:-.055em;
      margin-bottom:28px;
    }

    h1 span{
      color:var(--accent);
    }

    .intro{
      max-width:560px;
      color:var(--muted);
      font-size:17px;
      margin-bottom:28px;
    }

    .hero-btn{
      display:inline-block;
      background:var(--text);
      color:var(--bg);
      padding:12px 22px;
      border-radius:999px;
      font-size:14px;
    }

    .categories{
      position:sticky;
      top:76px;
      z-index:10;
      background:rgba(244,235,220,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      overflow:auto;
    }

    .categories-inner{
      display:flex;
      gap:8px;
      padding:14px 0;
      white-space:nowrap;
    }

    .category{
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 15px;
      font-size:13px;
    }

    .menu{
      padding:30px 0 90px;
    }

    .menu-section{
      padding:45px 0;
      border-bottom:1px solid var(--line);
    }

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:15px;
    }

    .section-head h2{
      font-size:32px;
      line-height:1.1;
    }

    .section-number{
      color:var(--accent);
      font-size:12px;
      letter-spacing:.15em;
    }

    .item{
      display:grid;
      grid-template-columns:120px 1fr;
      align-items:center;
      gap:18px;
      padding:18px 0;
      border-top:1px solid var(--line);
    }

    .item-image{
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:16px;
      display:block;
      background:#ddd;
    }

    .item-info{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
    }

    .item-name{
      font-size:18px;
      font-weight:600;
    }

    .item-price{
      font-size:18px;
      font-weight:700;
      white-space:nowrap;
    }

    .item-price small{
      color:var(--muted);
      font-size:10px;
      font-weight:400;
    }

    .contact{
      background:var(--text);
      color:var(--bg);
      padding:60px 0;
    }

    .contact-inner{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:30px;
    }

    .contact h2{
      font-size:42px;
      line-height:1.1;
    }

    .contact p{
      color:#b9ad9d;
      margin-top:15px;
    }

    .contact-btn{
      background:var(--bg);
      color:var(--text);
      padding:12px 22px;
      border-radius:999px;
      white-space:nowrap;
    }

    footer{
      background:var(--text);
      color:#8d8175;
      border-top:1px solid #3a3028;
      padding:24px 0;
      font-size:12px;
    }

    @media(max-width:700px){

      .container{
        width:92%;
      }

      .nav-links{
        display:none;
      }

      .hero{
        padding:75px 0 60px;
      }

      h1{
        font-size:57px;
      }

      .item{
        grid-template-columns:84px 1fr;
        gap:14px;
      }

      .item-image{
        width:84px;
        height:84px;
        border-radius:12px;
      }

      .item-name{
        font-size:16px;
      }

      .item-price{
        font-size:15px;
      }

      .contact-inner{
        display:block;
      }

      .contact h2{
        font-size:34px;
      }

      .contact-btn{
        display:inline-block;
        margin-top:25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>

      <div class="brand" id="restaurantName">
        CIRCLE<span>01</span>
      </div>

      <div class="nav-links">
        <a href="#menu">المنيو</a>
        <a href="#contact">تواصل</a>
      </div>

    </nav>
  </div>
</header>


<section class="hero">
  <div class="container">

    <div class="eyebrow">
      DIGITAL MENU
    </div>

    <h1 id="heroTitle">
      اسم المطعم.<br>
      <span>مزاج أفضل.</span>
    </h1>

    <p class="intro" id="heroIntro">
      اكتشف قائمتنا واختر مشروبك أو وجبتك المفضلة.
    </p>

    <a href="#menu" class="hero-btn">
      استعرض المنيو ↓
    </a>

  </div>
</section>


<div class="categories">
  <div class="container">
    <div class="categories-inner" id="categoryNav"></div>
  </div>
</div>


<main id="menu" class="menu">

  <div class="container" id="menuContainer"></div>

</main>


<section class="contact" id="contact">

  <div class="container">

    <div class="contact-inner">

      <div>

        <h2 id="contactTitle">
          أكثر من مجرد منيو.
        </h2>

        <p id="contactInfo">
          تصميم رقمي بسيط، سريع واحترافي.
        </p>

      </div>

      <a
        class="contact-btn"
        id="contactButton"
        href="#"
      >
        تواصل معنا
      </a>

    </div>

  </div>

</section>


<footer>
  <div class="container">
    © 2026 <span id="footerName">CIRCLE01</span> · Digital Menu
  </div>
</footer>


<script>

async function loadMenu(){

  try{

    const response = await fetch("menu-data.json");

    if(!response.ok){
      throw new Error("menu-data.json not found");
    }

    const data = await response.json();

    renderMenu(data);

  }catch(error){

    document.getElementById("menuContainer").innerHTML = `
      <p style="padding:40px 0;color:#9e5521">
        تعذر تحميل بيانات المنيو.
      </p>
    `;

    console.error(error);
  }
}


function renderMenu(data){

  document.title = data.restaurant + " — Digital Menu";

  document.getElementById("restaurantName").innerHTML =
    data.restaurant;

  document.getElementById("footerName").textContent =
    data.restaurant;


  document.getElementById("heroTitle").innerHTML = `
    ${data.restaurant}.<br>
    <span>${data.tagline}</span>
  `;


  document.getElementById("heroIntro").textContent =
    "اكتشف قائمتنا واختر مشروبك أو وجبتك المفضلة.";


  const categoryNav =
    document.getElementById("categoryNav");

  const menuContainer =
    document.getElementById("menuContainer");


  categoryNav.innerHTML = "";
  menuContainer.innerHTML = "";


  data.sections.forEach((section,index)=>{

    const sectionId = `section-${index+1}`;


    const category =
      document.createElement("a");

    category.className = "category";

    category.href = `#${sectionId}`;

    category.textContent = section.name;

    categoryNav.appendChild(category);


    const sectionElement =
      document.createElement("section");

    sectionElement.className =
      "menu-section";

    sectionElement.id =
      sectionId;


    sectionElement.innerHTML = `
      <div class="section-head">

        <h2>${section.name}</h2>

        <span class="section-number">
          ${String(index+1).padStart(2,"0")}
        </span>

      </div>
    `;


    section.items.forEach(item=>{

      const article =
        document.createElement("article");

      article.className = "item";


      article.innerHTML = `

        <img
          class="item-image"
          src="${item.image}"
          alt="${item.name}"
          loading="lazy"
          onerror="this.style.display='none'"
        >

        <div class="item-info">

          <div class="item-name">
            ${item.name}
          </div>

          <div class="item-price">
            ${Number(item.price).toLocaleString("en-US")}
            <small>IQD</small>
          </div>

        </div>

      `;


      sectionElement.appendChild(article);

    });


    menuContainer.appendChild(sectionElement);

  });


  if(data.phone){

    document.getElementById("contactButton").href =
      "tel:" + data.phone;

  }

  if(data.address || data.hours){

    document.getElementById("contactInfo").textContent =
      [data.address,data.hours]
      .filter(Boolean)
      .join(" · ");

  }

}


loadMenu();

</script>

</body>
</html>
