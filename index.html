<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Digital Menu">
<title>Digital Menu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f4ebdc;
  --text:#0b0705;
  --accent:#9e5521;
  --muted:#6e655c;
  --line:rgba(11,7,5,.15);
  --dark:#0b0705;
  --dark-muted:#b9ad9d;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Cairo",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.container{width:min(1180px,92%);margin:auto}

header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center}
.brand-logo{width:120px;height:52px;object-fit:contain;display:block}

.nav-right{display:flex;align-items:center;gap:10px}
.nav-links{display:flex;gap:8px}
.nav-links a,.category{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 14px;
  font-size:13px;
}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{
  border:0;background:transparent;color:var(--text);
  padding:7px 12px;font-size:12px;cursor:pointer
}
.lang-switch button.active{background:var(--text);color:var(--bg)}

.hero{padding:100px 0 80px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.16em;margin-bottom:20px;direction:ltr}
h1{font-size:clamp(52px,9vw,105px);line-height:.98;letter-spacing:-.055em;margin-bottom:28px}
h1 span{color:var(--accent)}
.intro{max-width:600px;color:var(--muted);font-size:17px;margin-bottom:28px}
.hero-btn{
  display:inline-block;background:var(--text);color:var(--bg);
  padding:12px 22px;border-radius:999px;font-size:14px
}

.categories{
  position:sticky;top:76px;z-index:20;
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);overflow:auto
}
.categories-inner{display:flex;gap:8px;padding:14px 0;white-space:nowrap}
.category{display:inline-block}

.menu{padding:30px 0 90px}
.menu-section{padding:45px 0;border-bottom:1px solid var(--line)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
.section-head h2{font-size:32px;line-height:1.1}
.section-number{color:var(--accent);font-size:12px;letter-spacing:.15em;direction:ltr}

.item{
  display:grid;grid-template-columns:120px 1fr;align-items:center;
  gap:18px;padding:18px 0;border-top:1px solid var(--line)
}
.item-image{
  width:120px;height:120px;object-fit:cover;border-radius:16px;
  display:block;background:rgba(0,0,0,.06)
}
.item-info{display:flex;justify-content:space-between;align-items:center;gap:15px}
.item-name{font-size:18px;font-weight:600}
.item-price{font-size:18px;font-weight:700;white-space:nowrap}
.item-price small{color:var(--muted);font-size:10px;font-weight:400}

.contact{background:var(--dark);color:var(--bg);padding:60px 0}
.contact-inner{display:flex;justify-content:space-between;align-items:end;gap:30px}
.contact h2{font-size:42px;line-height:1.1}
.contact p{color:var(--dark-muted);margin-top:15px}
.contact-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.contact-btn{
  background:var(--bg);color:var(--text);padding:12px 22px;
  border-radius:999px;white-space:nowrap
}
.contact-btn.secondary{background:transparent;color:var(--bg);border:1px solid rgba(244,235,220,.25)}

footer{background:var(--dark);color:#8d8175;border-top:1px solid #3a3028;padding:24px 0;font-size:12px}

.error{
  padding:40px 0;color:var(--accent);line-height:1.8
}

@media(max-width:700px){
  .container{width:92%}
  .brand-logo{width:95px;height:46px}
  .nav-links{display:none}
  .hero{padding:75px 0 60px}
  h1{font-size:57px}
  .item{grid-template-columns:84px 1fr;gap:14px}
  .item-image{width:84px;height:84px;border-radius:12px}
  .item-name{font-size:16px}
  .item-price{font-size:15px}
  .contact-inner{display:block}
  .contact h2{font-size:34px}
  .contact-links{justify-content:flex-start;margin-top:25px}
  .contact-btn{display:inline-block}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <a class="brand" href="#top" aria-label="Home">
        <img id="logo" class="brand-logo" src="images/logo.png" alt="Restaurant Logo">
      </a>

      <div class="nav-right">
        <div class="nav-links">
          <a href="#menu" id="navMenu">المنيو</a>
          <a href="#contact" id="navContact">تواصل</a>
        </div>

        <div class="lang-switch" aria-label="Language">
          <button id="arBtn" class="active" onclick="setLanguage('ar')">عربي</button>
          <button id="enBtn" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </nav>
  </div>
</header>

<section class="hero" id="top">
  <div class="container">
    <div class="eyebrow">DIGITAL MENU</div>
    <h1 id="heroTitle"></h1>
    <p class="intro" id="heroIntro"></p>
    <a href="#menu" class="hero-btn" id="heroButton"></a>
  </div>
</section>

<div class="categories">
  <div class="container">
    <div class="categories-inner" id="categoryNav"></div>
  </div>
</div>

<main id="menu" class="menu">
  <div class="container" id="menuContainer"></div>
</main>

<section class="contact" id="contact">
  <div class="container">
    <div class="contact-inner">
      <div>
        <h2 id="contactTitle"></h2>
        <p id="contactInfo"></p>
      </div>

      <div class="contact-links">
        <a class="contact-btn" id="contactButton" href="#">تواصل معنا</a>
        <a class="contact-btn secondary" id="instagramButton" href="#" target="_blank" rel="noopener">Instagram</a>
        <a class="contact-btn secondary" id="tiktokButton" href="#" target="_blank" rel="noopener">TikTok</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    © <span id="year"></span>
    <span id="footerName"></span>
    · Digital Menu
  </div>
</footer>

<script>
let currentLanguage = "ar";
let menuData = null;

const T = {
  navMenu:{ar:"المنيو",en:"Menu"},
  navContact:{ar:"تواصل",en:"Contact"},
  heroButton:{ar:"استعرض المنيو ↓",en:"View Menu ↓"},
  heroIntro:{
    ar:"اكتشف قائمتنا واختر مشروبك أو وجبتك المفضلة.",
    en:"Explore our menu and choose your favorite drink or meal."
  },
  contactTitle:{ar:"أكثر من مجرد منيو.",en:"More than a menu."},
  contactButton:{ar:"تواصل معنا",en:"Contact Us"},
  fallbackContact:{
    ar:"تصميم رقمي بسيط، سريع واحترافي.",
    en:"Simple, fast and professional digital design."
  }
};

function setVar(name,value){
  if(value) document.documentElement.style.setProperty(name,value);
}

function applyTheme(){
  const theme = menuData?.theme || {};
  setVar("--bg",theme.background);
  setVar("--text",theme.text);
  setVar("--accent",theme.accent);
  setVar("--muted",theme.muted);
  setVar("--dark",theme.text);
  setVar("--line",theme.line || "rgba(11,7,5,.15)");
}

function safeText(value){
  return value == null ? "" : String(value);
}

function socialUrl(platform,value){
  if(!value) return "#";
  if(/^https?:\/\//i.test(value)) return value;
  if(platform === "instagram") return "https://instagram.com/" + value.replace(/^@/,"");
  if(platform === "tiktok") return "https://www.tiktok.com/@" + value.replace(/^@/,"");
  return "#";
}

function renderMenu(){
  if(!menuData) return;

  const lang = currentLanguage;
  const restaurant = menuData.restaurant;
  const tagline = menuData.tagline;

  document.title = `${restaurant[lang]} — Digital Menu`;
  document.getElementById("footerName").textContent = restaurant[lang];

  document.getElementById("heroTitle").innerHTML =
    `${restaurant[lang]}.<br><span>${tagline[lang]}</span>`;

  document.getElementById("heroIntro").textContent = T.heroIntro[lang];
  document.getElementById("heroButton").textContent = T.heroButton[lang];

  document.getElementById("navMenu").textContent = T.navMenu[lang];
  document.getElementById("navContact").textContent = T.navContact[lang];

  document.getElementById("contactTitle").textContent = T.contactTitle[lang];
  document.getElementById("contactButton").textContent = T.contactButton[lang];

  let contactText = "";
  if(menuData.address?.[lang]) contactText += menuData.address[lang];
  if(menuData.hours?.[lang]){
    if(contactText) contactText += " · ";
    contactText += menuData.hours[lang];
  }
  document.getElementById("contactInfo").textContent =
    contactText || T.fallbackContact[lang];

  const logo = menuData.logo || "images/logo.png";
  document.getElementById("logo").src = logo;
  document.getElementById("logo").alt = restaurant[lang];

  document.getElementById("categoryNav").innerHTML = "";
  document.getElementById("menuContainer").innerHTML = "";

  (menuData.sections || []).forEach((section,index)=>{
    const sectionId = `section-${index+1}`;

    const category = document.createElement("a");
    category.className = "category";
    category.href = `#${sectionId}`;
    category.textContent = section.name[lang];
    document.getElementById("categoryNav").appendChild(category);

    const sectionElement = document.createElement("section");
    sectionElement.className = "menu-section";
    sectionElement.id = sectionId;

    sectionElement.innerHTML = `
      <div class="section-head">
        <h2>${section.name[lang]}</h2>
        <span class="section-number">${String(index+1).padStart(2,"0")}</span>
      </div>
    `;

    (section.items || []).forEach(item=>{
      const article = document.createElement("article");
      article.className = "item";

      const image = item.image || "";
      const name = item.name?.[lang] || "";

      article.innerHTML = `
        <img
          class="item-image"
          src="${image}"
          alt="${name}"
          loading="lazy"
          onerror="this.style.display='none'"
        >
        <div class="item-info">
          <div class="item-name">${name}</div>
          <div class="item-price">
            ${Number(item.price || 0).toLocaleString("en-US")}
            <small>IQD</small>
          </div>
        </div>
      `;

      sectionElement.appendChild(article);
    });

    document.getElementById("menuContainer").appendChild(sectionElement);
  });

  const phone = menuData.phone;
  const contactButton = document.getElementById("contactButton");
  contactButton.href = phone ? `tel:${phone}` : "#";

  const instagram = document.getElementById("instagramButton");
  const tiktok = document.getElementById("tiktokButton");

  instagram.href = socialUrl("instagram",menuData.instagram);
  tiktok.href = socialUrl("tiktok",menuData.tiktok);

  instagram.style.display = menuData.instagram ? "inline-block" : "none";
  tiktok.style.display = menuData.tiktok ? "inline-block" : "none";
}

function setLanguage(language){
  currentLanguage = language;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  document.getElementById("arBtn").classList.toggle("active",language === "ar");
  document.getElementById("enBtn").classList.toggle("active",language === "en");

  renderMenu();
}

async function loadMenu(){
  try{
    const response = await fetch("menu-data.json");

    if(!response.ok) throw new Error("menu-data.json not found");

    menuData = await response.json();

    applyTheme();
    renderMenu();
  }catch(error){
    console.error(error);
    document.getElementById("menuContainer").innerHTML = `
      <div class="error">
        تعذر تحميل بيانات المنيو.<br>
        تأكد من وجود ملف menu-data.json وأن صيغة JSON صحيحة.
      </div>
    `;
  }
}

document.getElementById("year").textContent = new Date().getFullYear();
loadMenu();
</script>

</body>
</html>
